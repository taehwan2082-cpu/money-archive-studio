name: Daily 09AM & 06PM KST Money Archive YouTube Uploader

on:
  schedule:
    # 매일 한국시간(KST) 오전 09:00 (UTC 00:00) 및 오후 18:00 (UTC 09:00) 자동 실행
    - cron: "0 0 * * *"
    - cron: "0 9 * * *"
  workflow_dispatch:
    inputs:
      ep_id:
        description: "특정 회차 ID 지정 (비워두면 첫 번째 pending 회차 자동 업로드)"
        required: false
        default: ""

permissions:
  contents: write

concurrency:
  group: money-archive-youtube-upload
  cancel-in-progress: false

jobs:
  build-and-upload:
    name: Build & Upload Next Pending Episode to Money Archive
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      YOUTUBE_TOKEN_JSON: ${{ secrets.YOUTUBE_TOKEN_JSON }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install FFmpeg & Korean Fonts
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg fonts-nanum

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Python dependencies
        run: |
          pip install --upgrade pip
          pip install google-api-python-client google-auth google-auth-oauthlib google-auth-httplib2 edge-tts Pillow

      - name: Restore YouTube OAuth Token & Run Self-Healing Uploader
        if: env.YOUTUBE_TOKEN_JSON != ''
        run: |
          printf '%s' "$YOUTUBE_TOKEN_JSON" > youtube_token_money_archive.json
          if [ -n "${{ github.event.inputs.ep_id }}" ]; then
            python upload_today_batch_api.py --ep-id "${{ github.event.inputs.ep_id }}" --stagger-shorts-minutes 150
          else
            python upload_today_batch_api.py --stagger-shorts-minutes 150
          fi
          rm -f youtube_token_money_archive.json

      - name: Commit & Push Updated Episode Queue
        if: env.YOUTUBE_TOKEN_JSON != ''
        run: |
          git config user.name "Money Archive Auto Bot"
          git config user.email "actions@github.com"
          git add auto_pipeline/episode_queue.json
          git diff --staged --quiet || (git commit -m "chore(auto): mark uploaded episode as published in queue" && git push origin main)

      - name: Remind Secret Setup if YOUTUBE_TOKEN_JSON is missing
        if: env.YOUTUBE_TOKEN_JSON == ''
        run: |
          echo "::warning::GitHub Repository Secret 'YOUTUBE_TOKEN_JSON'이 아직 등록되지 않아 클라우드 업로드는 건너뛰었습니다. Settings > Secrets and variables > Actions에서 youtube_token_money_archive.json 내용을 YOUTUBE_TOKEN_JSON으로 등록하면 PC가 꺼져 있어도 매일 09:00 / 18:00 KST에 자동 업로드됩니다."
